CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes; 60 minutes reduces reconnects with minimal extra power draw
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 30 seconds idle before suspending the touchpad (saves ~1.2mA, ~300ms wake delay)
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
